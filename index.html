<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Trust Issues</title>
<meta name="theme-color" content="#1b1230">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: playful arcade, warm and bold, few words
   IDEA: a handheld arcade cartridge of Bible stories
   PICTURE: the live game canvas fills the screen
   COLOUR and TYPE: desert sunset, cream cards, orange buttons; Lilita One + Nunito
   LAYOUT: full-screen canvas, pop-up cards between levels */
html,body{margin:0;height:100%;background:#120d1c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wrap{position:relative;max-width:520px;height:100%;height:100dvh;margin:0 auto;overflow:hidden;background:#1b1230}
canvas{display:block;width:100%;height:100%;touch-action:none}
#safe{position:absolute;padding-top:env(safe-area-inset-top);visibility:hidden}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;padding-top:calc(22px + env(safe-area-inset-top));padding-bottom:calc(22px + env(safe-area-inset-bottom));background:rgba(14,8,24,.5);transition:opacity .3s;z-index:3}
#ov.hide{opacity:0;pointer-events:none}
#ov.menu{background:linear-gradient(transparent 40%,rgba(14,8,24,.55));align-items:flex-end}
.card{width:100%;max-width:370px;background:#fff8ec;color:#2a1a10;border-radius:26px;padding:24px 22px;text-align:center;box-shadow:0 10px 0 #c9853b,0 30px 60px rgba(0,0,0,.5);animation:popin .45s cubic-bezier(.2,1.4,.4,1) both;font-family:Nunito,sans-serif}
@keyframes popin{from{transform:scale(.7) translateY(30px);opacity:0}}
.lv{font:900 12px Nunito,sans-serif;color:#c9853b;letter-spacing:.06em}
.card h1{font:400 44px/1 'Lilita One',sans-serif;margin:6px 0 10px}
.goal{font:800 18px/1.35 Nunito,sans-serif;margin:0 0 4px}
.ctrl{display:inline-block;font:900 13px Nunito,sans-serif;background:#2a1a10;color:#ffd76a;padding:8px 14px;border-radius:99px;margin:10px 0 18px}
.ref{font:700 13px Nunito,sans-serif;color:#8a6a50;margin:6px 0 16px}
.irl{font:800 14px/1.35 Nunito,sans-serif;background:#ffe9c7;border-radius:14px;padding:10px 12px;margin:12px 0 4px;text-align:left}
.irl b{color:#ff6b3d;margin-right:6px}
.stars{font-size:46px;letter-spacing:6px;color:#f5a623;margin:2px 0 6px;text-shadow:0 3px 0 #b8741a;line-height:1.1}
.stars .off{color:#e6d8c4;text-shadow:none}
.btn{display:block;font:400 24px 'Lilita One',sans-serif;color:#fff;background:#ff6b3d;border:0;border-radius:18px;padding:14px 30px;box-shadow:0 6px 0 #b8401c;cursor:pointer;width:100%;min-height:56px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b8401c}
.btn:focus-visible{outline:3px solid #2a1a10;outline-offset:3px}
.btn.alt{background:#2a1a10;box-shadow:0 6px 0 #000;font-size:18px;margin-top:14px;min-height:48px}
.menuin{width:100%;max-width:370px;text-align:center;animation:popin .6s cubic-bezier(.2,1.4,.4,1) both;margin-bottom:6vh}
.title{font:400 clamp(58px,17vw,80px)/.88 'Lilita One',sans-serif;color:#ffd76a;text-shadow:0 5px 0 #c9532a,0 12px 30px rgba(0,0,0,.45);margin-bottom:12px}
.sub{font:800 17px Nunito,sans-serif;color:#fff;margin-bottom:22px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.big{font:400 64px/1 'Lilita One',sans-serif;color:#2a1a10;margin:4px 0}
details{text-align:left;margin-top:14px;font:700 14px/1.45 Nunito,sans-serif;color:#5a4030}
summary{cursor:pointer;font-weight:900;color:#2a1a10}
details ol{padding-left:20px;margin:8px 0 0}
#mute{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:4;width:44px;height:44px;border-radius:14px;border:0;background:rgba(0,0,0,.35);color:#fff;font:900 12px Nunito,sans-serif;cursor:pointer}
@media (prefers-reduced-motion:reduce){.card,.menuin{animation:none}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="safe"></div>
  <button id="mute" aria-label="Toggle sound">SND</button>
  <div id="ov"></div>
</div>
<script>
{
/* ================= SETUP ================= */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
let W=400,H=700,SAFE=0;
function resize(){const r=cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);SAFE=parseFloat(getComputedStyle(document.getElementById('safe')).paddingTop)||0;}
addEventListener('resize',resize);resize();
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---- input ---- */
const P={x:W/2,y:H/2,down:false,mouse:false,taps:[]},K={};
function pos(e){const r=cv.getBoundingClientRect();P.x=e.clientX-r.left;P.y=e.clientY-r.top;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();pos(e);P.down=true;P.mouse=e.pointerType==='mouse';P.taps.push({x:P.x,y:P.y});audioInit();});
cv.addEventListener('pointermove',e=>{pos(e);P.mouse=e.pointerType==='mouse';});
addEventListener('pointerup',()=>P.down=false);addEventListener('pointercancel',()=>P.down=false);
addEventListener('keydown',e=>{K[e.key]=true;if(e.key===' '||e.key==='ArrowUp'||e.key==='Enter'){P.taps.push({x:-999,y:-999,key:true});}if(e.key===' ')e.preventDefault();audioInit();});
addEventListener('keyup',e=>K[e.key]=false);

/* ---- sound ---- */
let AC=null,muted=false;
function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function snd(f,d=.1,type='square',v=.05,slide=0){if(!AC||muted)return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}}
function chord(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>snd(f,.35,'triangle',.06),i*110));}
const mb=document.getElementById('mute');mb.onclick=()=>{muted=!muted;mb.textContent=muted?'MUTE':'SND';audioInit();};

/* ---- particles & fx ---- */
let parts=[],shake=0;
function burst(x,y,c,n=10,sp=120){for(let i=0;i<n;i++){const a=rnd(0,6.28),v=rnd(sp*.3,sp);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.4,.9),c,r:rnd(2,4.5)});}}
function floatText(x,y,s,c){parts.push({x:clamp(x,40,W-40),y,vx:0,vy:-55,life:1.1,txt:s,c});}
function updParts(dt){parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.txt)p.vy+=220*dt;p.life-=dt;});parts=parts.filter(p=>p.life>0);}
function drawParts(){parts.forEach(p=>{ctx.globalAlpha=clamp(p.life*2,0,1);if(p.txt)txtO(p.txt,p.x,p.y,22,p.c);else circ(p.x,p.y,p.r,p.c);});ctx.globalAlpha=1;}

/* ---- drawing helpers ---- */
function circ(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();}
function rrect(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function txt(s,x,y,size,c,align='center',font="'Lilita One'"){ctx.font=`${size}px ${font},sans-serif`;ctx.fillStyle=c;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y);}
function txtO(s,x,y,size,c,o='#2a1a10',align='center'){ctx.font=`${size}px 'Lilita One',sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=Math.max(3,size/4.5);ctx.strokeStyle=o;ctx.strokeText(s,x,y);ctx.fillStyle=c;ctx.fillText(s,x,y);}
function shade(h,a){const n=parseInt(h.slice(1),16);const r=clamp((n>>16)+a,0,255),g=clamp((n>>8&255)+a,0,255),b=clamp((n&255)+a,0,255);return `rgb(${r},${g},${b})`;}
function bubble(x,y,s,bg='#fff',fg='#2a1a10',size=14){ctx.font=`900 ${size}px Nunito,sans-serif`;const w=ctx.measureText(s).width+22,h=size+14;const bx=clamp(x,w/2+6,W-w/2-6);ctx.fillStyle=bg;rrect(bx-w/2,y-h-8,w,h,11);ctx.fill();ctx.beginPath();ctx.moveTo(x-6,y-9);ctx.lineTo(x+6,y-9);ctx.lineTo(x,y);ctx.fill();ctx.fillStyle=fg;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s,bx,y-8-h/2+1);}
function hud(name,right){const y=30+SAFE;txtO(name,16,y,22,'#fff','#2a1a10','left');if(right)txtO(right,W-62,y,22,'#fff','#2a1a10','right');}
function bar(x,y,w,h,p,c,label){ctx.fillStyle='rgba(20,10,30,.55)';rrect(x,y,w,h,h/2);ctx.fill();if(p>0){ctx.fillStyle=c;rrect(x+2,y+2,Math.max(h-4,(w-4)*clamp(p,0,1)),h-4,(h-4)/2);ctx.fill();}if(label){ctx.font="900 11px Nunito,sans-serif";ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,x+w/2,y+h/2+.5);}}

/* ---- characters ---- */
function person(x,y,h,o){
  const s=h/60;ctx.save();ctx.translate(x,y);ctx.scale((o.face||1)*s,s);
  const ph=o.walk||0,sw=Math.sin(ph)*7,bob=Math.abs(Math.sin(ph))*1.6;
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(0,0,14,3.5,0,0,6.3);ctx.fill();
  if(o.kneel)ctx.translate(0,13);
  ctx.translate(0,-bob);ctx.lineCap='round';
  const skin=o.skin||'#b97a4f';
  if(!o.kneel){ctx.strokeStyle=o.legs||skin;ctx.lineWidth=4.5;ctx.beginPath();ctx.moveTo(-3,-14);ctx.lineTo(-3+sw,bob);ctx.moveTo(3,-14);ctx.lineTo(3-sw,bob);ctx.stroke();}
  ctx.strokeStyle=shade(o.robe,-35);ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-1,-38);
  if(o.armsUp)ctx.lineTo(-7,-58);else ctx.lineTo(-4-sw*.6,-24);ctx.stroke();
  ctx.fillStyle=o.robe;ctx.beginPath();ctx.moveTo(-8,-43);ctx.lineTo(8,-43);ctx.lineTo(13,-11);ctx.quadraticCurveTo(0,-8,-13,-11);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.moveTo(3,-43);ctx.lineTo(8,-43);ctx.lineTo(13,-11);ctx.lineTo(7,-10);ctx.closePath();ctx.fill();
  if(o.sash){ctx.fillStyle=o.sash;ctx.fillRect(-10.5,-31,21,4);ctx.fillRect(4,-31,4,14);}
  ctx.strokeStyle=shade(o.robe,-18);ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(2,-38);
  let hx,hy;if(o.reach){hx=17;hy=-33}else if(o.armsUp){hx=8;hy=-59}else{hx=4+sw*.6;hy=-24}
  ctx.lineTo(hx,hy);ctx.stroke();circ(hx,hy,2.6,skin);
  if(o.scarf){ctx.fillStyle=o.scarf;ctx.beginPath();ctx.moveTo(-9,-52);ctx.lineTo(-11,-37);ctx.lineTo(3,-39);ctx.lineTo(6,-47);ctx.closePath();ctx.fill();circ(-1,-51,10,o.scarf);circ(1.6,-49.5,7,skin);}
  else{circ(0,-50,8,skin);if(o.hair){ctx.fillStyle=o.hair;ctx.beginPath();ctx.arc(0,-51,8.5,Math.PI*.95,Math.PI*2.02);ctx.fill();if(o.long){ctx.fillRect(-8.5,-52,5,13);}}}
  if(o.beard){ctx.fillStyle=o.beard;ctx.beginPath();ctx.arc(1.5,-47,6.5,.05,Math.PI-.3);ctx.fill();}
  const ex=o.scarf?5:4.5;circ(ex,-51,1.5,'#1a1a1a');
  ctx.strokeStyle='#5a2a1a';ctx.lineWidth=1.4;ctx.beginPath();
  if(o.mood==='sad')ctx.arc(5,-43.5,2.4,Math.PI*1.15,Math.PI*1.85);
  else if(o.mood==='happy')ctx.arc(5,-47,2.4,Math.PI*.15,Math.PI*.85);
  else if(o.mood==='shout'){ctx.fillStyle='#5a2a1a';ctx.ellipse(5.5,-45.5,2,2.6,0,0,6.3);ctx.fill();}
  else{ctx.moveTo(3.5,-45.5);ctx.lineTo(7,-45.5);}
  ctx.stroke();
  if(o.halo){ctx.strokeStyle='rgba(255,215,106,.95)';ctx.lineWidth=2.4;ctx.shadowColor='#ffd76a';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(-1,-52,13,0,6.3);ctx.stroke();ctx.shadowBlur=0;}
  ctx.restore();
}

/* ---- backgrounds ---- */
function dune(y,amp,c,f,off){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W+10;x+=10)ctx.lineTo(x,y+Math.sin(x*f+off)*amp+Math.sin(x*f*2.3+off)*amp*.3);ctx.lineTo(W,H);ctx.closePath();ctx.fill();}
function sky(top,mid,bot,hz){const g=ctx.createLinearGradient(0,0,0,hz);g.addColorStop(0,top);g.addColorStop(.6,mid);g.addColorStop(1,bot);ctx.fillStyle=g;ctx.fillRect(0,0,W,hz+2);}
function desert(off=0){const hz=H*.58;sky('#3a1f5c','#e86f5a','#ffc77a',hz);
  ctx.shadowColor='#fff0c2';ctx.shadowBlur=40;circ(W*.74,hz-48,34,'#fff0c2');ctx.shadowBlur=0;
  dune(hz,14,'#c97a45',.011,off*.2);dune(hz+30,20,'#df9852',.009,1+off*.5);dune(hz+70,16,'#eeb067',.013,2+off);}

/* ================= LEVEL 1 — MANNA ================= */
function LManna(){
  let px=W/2,walk=0,face=1,sad=0,t=30,bar0=0,goal=18,items=[],ms=0,gs=1.4,phase='manna',qt=0,quail=0,hits=0,flash=0,tint=0,endIn=0,hint=3;
  const gy=()=>H*.88,G=['Egypt had fish!','Manna AGAIN?','Back to Egypt','We want meat','this is so mid','I miss garlic'];
  const o={done:false};
  o.update=dt=>{
    let tx=px;if(P.down||P.mouse)tx=P.x;if(K.ArrowLeft)tx=px-200;if(K.ArrowRight)tx=px+200;
    const d=clamp(tx-px,-430*dt,430*dt);px=clamp(px+d,22,W-22);if(Math.abs(d)>.6){walk+=dt*15;face=d>0?1:-1;}
    sad=Math.max(0,sad-dt);flash=Math.max(0,flash-dt);hint-=dt;
    if(phase==='manna'){t-=dt;
      ms-=dt;if(ms<=0){items.push({k:'m',x:rnd(20,W-20),y:-10,vy:rnd(150,230)+(30-t)*3});ms=.42;}
      gs-=dt;if(gs<=0){items.push({k:'g',x:rnd(60,W-60),y:-24,vy:rnd(160,230)+(30-t)*3,txt:pick(G)});gs=rnd(.5,.9);}
      if(bar0>=goal){phase='quail';qt=6;items=[];snd(660,.4,'triangle',.07,500);}
      else if(t<=0){phase='end';endIn=.4;items=[];}
    }else if(phase==='quail'){qt-=dt;
      ms-=dt;if(ms<=0){items.push({k:'q',x:rnd(20,W-20),y:-10,vy:rnd(160,250),f:rnd(0,6)});ms=.12;}
      if(qt<=0){phase='end';items=[];if(quail>5){tint=2;shake=12;snd(110,1,'sawtooth',.08,-50);endIn=2;}else endIn=.5;}
    }else if(phase==='end'){tint=Math.max(0,tint-dt*.5);endIn-=dt;
      if(endIn<=0&&!o.done){o.done=true;let st=3;if(hits>=2)st--;if(bar0<goal)st--;if(quail>5)st-=2;st=clamp(st,1,3);
        o.result={stars:st,msg:bar0<goal?'The grumbling ate your manna. That’s what complaining does.':quail>5?`You grabbed ${quail} quail. The game never said you needed more. You decided that. So did Israel.`:'You stopped at enough. That’s trust.',irl:'Your feed is the new grumble cloud. Don’t let it eat your manna.'};}}
    const hy=gy()-68;
    items.forEach(i=>{i.y+=i.vy*dt;if(i.k==='q')i.f+=dt*20;
      if(!i.dead&&Math.abs(i.y-hy)<26&&Math.abs(i.x-px)<(i.k==='g'?46:30)){i.dead=true;
        if(i.k==='m'){bar0++;burst(i.x,i.y,'#fff6d8',8,90);snd(700+bar0*40,.07,'triangle',.06);}
        else if(i.k==='g'){bar0=Math.max(0,bar0-3);hits++;sad=.9;shake=8;flash=.25;floatText(px,hy-30,'-3 manna','#ff5d73');snd(160,.25,'sawtooth',.07,-60);}
        else{quail++;floatText(i.x,i.y,'+50','#ffd76a');burst(i.x,i.y,'#c9853b',6,80);snd(600+quail*12,.05,'square',.035);}}});
    items=items.filter(i=>!i.dead&&i.y<H+40);
  };
  o.draw=()=>{desert(T*.05);
    const hz=H*.58;
    for(let k=0;k<5;k++){const x=W*.08+k*W*.13,y=hz+44+(k%2)*10;ctx.fillStyle=k%2?'#8a5a3a':'#a8704a';ctx.beginPath();ctx.moveTo(x-22,y);ctx.lineTo(x,y-28);ctx.lineTo(x+22,y);ctx.fill();ctx.fillStyle='#3a2414';ctx.beginPath();ctx.moveTo(x-4,y);ctx.lineTo(x,y-12);ctx.lineTo(x+4,y);ctx.fill();}
    ctx.globalAlpha=.75;for(let k=0;k<9;k++)circ(W*.9+Math.sin(T+k)*5,hz+20-k*24,20-k*.8,'#fff6e8');ctx.globalAlpha=1;
    items.forEach(i=>{
      if(i.k==='m'){ctx.shadowColor='#fff3c4';ctx.shadowBlur=10;circ(i.x,i.y,5.5,'#fffaf0');ctx.shadowBlur=0;}
      else if(i.k==='g'){bubble(i.x+Math.sin(T*6+i.x)*3,i.y,i.txt,'#5d6b4a','#e9f5d0',13);}
      else{ctx.save();ctx.translate(i.x,i.y);ctx.fillStyle='#8a5a2e';ctx.beginPath();ctx.ellipse(0,0,10,7,0,0,6.3);ctx.fill();circ(8,-5,5,'#6e4522');ctx.fillStyle='#f5a623';ctx.beginPath();ctx.moveTo(12,-5);ctx.lineTo(16,-4);ctx.lineTo(12,-3);ctx.fill();ctx.fillStyle='#b07a42';ctx.beginPath();ctx.moveTo(-2,-2);ctx.lineTo(-10,-2-Math.abs(Math.sin(i.f))*12);ctx.lineTo(4,-2);ctx.fill();ctx.restore();}
    });
    person(px,gy(),64,{robe:'#c9853b',scarf:'#6e3f22',face,walk,mood:sad>0?'sad':'happy',armsUp:true});
    ctx.fillStyle='#8a5a2e';ctx.beginPath();ctx.ellipse(px,gy()-70,22,7,0,0,6.3);ctx.fill();ctx.fillStyle='#b07a42';ctx.beginPath();ctx.ellipse(px,gy()-72,20,5,0,0,6.3);ctx.fill();
    if(bar0>0)for(let k=0;k<Math.min(bar0,10);k++)circ(px-14+k*3.2,gy()-75-(k%2)*2,3,'#fffaf0');
    if(tint>0){ctx.fillStyle=`rgba(70,150,50,${Math.min(.5,tint*.3)})`;ctx.fillRect(0,0,W,H);}
    if(flash>0){ctx.fillStyle=`rgba(255,60,80,${flash})`;ctx.fillRect(0,0,W,H);}
    hud('Wilderness',phase==='manna'?Math.ceil(t)+'s':'');
    bar(16,48+SAFE,W-32,20,bar0/goal,'#fff3c4',`DAILY MANNA ${Math.min(bar0,goal)}/${goal}`);
    if(phase==='quail'){txtO('QUAIL STORM!',W/2,H*.27,42,'#ffd76a');txtO(`${quail} × 50 PTS`,W/2,H*.27+42,26,'#fff');}
    if(phase==='end'&&quail>5)txtO('Numbers 11:33',W/2,H*.3,30,'#c8ff9a');
    if(hint>0&&phase==='manna')txtO('← drag →',px,gy()-110,20,'#fff');
  };
  return o;
}

/* ================= LEVEL 2 — 900 CHARIOTS ================= */
function LRun(){
  let t=0,dur=40,hearts=3,inv=0,by=0,vy=0,hist=[],obs=[],sp=1.6,scroll=0,rain=[],walk=0,flash=0,lit=false,hint=2.5;
  const gy=()=>H*.8,bx=()=>W*.42;const o={done:false,fail:false};
  o.update=dt=>{hint-=dt;
    if(o.done||o.fail){walk+=dt*5;return;}
    t+=dt;const pr=t/dur,spd=250+pr*90;scroll+=spd*dt;walk+=dt*17;
    if(P.taps.length&&by>=0){vy=-650;snd(440,.14,'square',.05,400);}
    vy+=1850*dt;by+=vy*dt;if(by>0){by=0;vy=0;}
    hist.push(by);if(hist.length>13)hist.shift();
    inv=Math.max(0,inv-dt);flash=Math.max(0,flash-dt*2);
    sp-=dt;if(sp<=0&&pr<.92){obs.push({x:W+70,stuck:false,sink:0,w:0});if(pr>.25&&Math.random()<.3)obs.push({x:W+70+rnd(150,190),stuck:false,sink:0,w:0});sp=rnd(1.05,1.7)-pr*.35;}
    const rainy=pr>.6;

    ctx.fillStyle='#ffd76a';ctx.fillRect(W/2-2,hz-160,4,40);ctx.fillRect(W/2-12,hz-148,24,4);
    ctx.fillStyle='#a8875e';ctx.fillRect(0,hz,W,H-hz);ctx.fillStyle='#9a7a52';for(let r=0;r<8;r++)for(let c=0;c<7;c++)if((r+c)%2)ctx.fillRect(c*W/6,hz+r*40,W/6,40);
    if(won){const a=Math.min(1,truth);const g=ctx.createLinearGradient(0,0,0,my());g.addColorStop(0,`rgba(255,240,180,${.9*a})`);g.addColorStop(1,`rgba(255,215,106,${.25*a})`);ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(mx()-20*a,0);ctx.lineTo(mx()+20*a,0);ctx.lineTo(mx()+80*a,my());ctx.lineTo(mx()-80*a,my());ctx.fill();}
    accs().forEach((a,i)=>person(a.x,a.y,54,{robe:AR[i],hair:'#2a1a10',beard:i%2?'#2a1a10':null,scarf:i%2?null:'#d8c8a8',face:a.f,armsUp:!won&&Math.sin(T*6+i)>0,kneel:won&&truth>.8,mood:won?'sad':'shout'}));
    if(s>.05&&!won){const r=34+46*s;const g=ctx.createRadialGradient(mx(),my()-32,r*.4,mx(),my()-32,r);g.addColorStop(0,'rgba(255,230,150,0)');g.addColorStop(1,`rgba(255,215,106,${.25+.4*s})`);ctx.fillStyle=g;circ(mx(),my()-32,r,g);ctx.strokeStyle=`rgba(255,215,106,${.4+.5*s})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(mx(),my()-32,r,0,6.3);ctx.stroke();}
    person(mx(),my(),64,{robe:'#2e2638',scarf:'#1c1624',skin:'#c99068',face:1,mood:shout>0?'shout':won?'happy':'',armsUp:shout>0,halo:won&&truth>.6});
    if(won&&truth>.6){ctx.fillStyle='#ffd76a';ctx.fillRect(mx()+2,my()-34,2,14);ctx.fillRect(mx()-3,my()-29,12,2);}
    if(shout>0)bubble(mx(),my()-74,'IT WASN’T ME!!','#ff5d73','#fff',15);
    shots.forEach(b=>{ctx.font="900 13px Nunito,sans-serif";const w=ctx.measureText(b.txt).width+16;ctx.fillStyle='#c4213a';rrect(b.x-w/2,b.y-11,w,22,11);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.txt,b.x,b.y+1);});
    if(!won){const pul=1+Math.sin(T*6)*.05,bw=200*pul,bh=50*pul,by=H*.92-bh/2;ctx.fillStyle='#8a1a2a';rrect(W/2-bw/2,by+5,bw,bh,16);ctx.fill();ctx.fillStyle='#e8344e';rrect(W/2-bw/2,by,bw,bh,16);ctx.fill();txt('DEFEND YOURSELF',W/2,by+bh/2+1,20,'#fff');}
    if(won&&truth>1)txtO('THE TRUTH CAME OUT',W/2,H*.3,30,'#fff3c4');
    if(flash>0){ctx.fillStyle=`rgba(255,60,80,${flash*.5})`;ctx.fillRect(0,0,W,H);}
    hud('Accused',won?'':Math.max(0,Math.ceil(dur-t))+'s');
    bar(16,48+SAFE,W-32,20,won?1:s,'#ffd76a',won?'GOD DEFENDED YOU':'PEACE');
  };
  return o;
}

/* ================= LEVEL 6 — PSALM CATCH ================= */
function LPsalm(){
  const WD=['Commit','your way','to the Lord,','trust','also','in Him,','and He','shall bring','it to pass.'];
  let px=W/2,walk=0,face=1,nx=0,miss=0,items=[],sp=.4,t=0,won=false,wt=0,sad=0;
  const gy=()=>H*.88,blds=Array.from({length:14},(_,i)=>({x:i/13,h:rnd(.12,.34),w:rnd(.06,.11),win:Math.floor(rnd(2,6))}));
  const o={done:false};
  o.update=dt=>{t+=dt;sad=Math.max(0,sad-dt);
    let tx=px;if(P.down||P.mouse)tx=P.x;if(K.ArrowLeft)tx=px-200;if(K.ArrowRight)tx=px+200;
    const d=clamp(tx-px,-430*dt,430*dt);px=clamp(px+d,30,W-30);if(Math.abs(d)>.6){walk+=dt*15;face=d>0?1:-1;}
    if(won){wt+=dt;items=[];if(wt>1.8&&!o.done){o.done=true;o.result={stars:miss===0?3:miss<=2?2:1,msg:'“Commit your way to the Lord, trust also in Him, and He shall bring it to pass.”',irl:'Say it before your next test. Say it at 1 AM when the feed starts talking.'};}return;}
    sp-=dt;if(sp<=0){let i=nx;if(Math.random()>.35&&nx<WD.length-1)i=nx+1+Math.floor(Math.random()*(WD.length-nx-1));items.push({i,x:rnd(60,W-60),y:-20,vy:rnd(140,190)+nx*6});sp=rnd(.5,.75);}
    const hy=gy()-66;
    items.forEach(it=>{it.y+=it.vy*dt;if(!it.dead&&Math.abs(it.y-hy)<24&&Math.abs(it.x-px)<44){it.dead=true;
      if(it.i===nx){nx++;burst(it.x,it.y,'#ffd76a',14,130);snd(500+nx*60,.1,'triangle',.06);if(nx>=WD.length){won=true;chord();}}
      else{miss++;sad=.8;shake=5;floatText(px,hy-30,'wrong order','#ff5d73');snd(170,.2,'sawtooth',.05,-50);}}});
    items=items.filter(i=>!i.dead&&i.y<H+30);
  };
  o.draw=()=>{const hz=H*.62;sky('#141a3a','#5a3a7a','#ff8a6a',hz);
    ctx.shadowColor='#ffd0a0';ctx.shadowBlur=40;circ(W*.3,hz-30,30,'#ffcf9a');ctx.shadowBlur=0;
    blds.forEach(b=>{const x=b.x*W-20,w=b.w*W+10,h=b.h*H;ctx.fillStyle='#1d1a33';ctx.fillRect(x,hz-h,w,h+2);ctx.fillStyle='rgba(255,215,106,.55)';for(let r=0;r<b.win;r++)for(let c=0;c<2;c++)if((r*3+c+Math.floor(b.x*20))%4)ctx.fillRect(x+6+c*(w/2-4),hz-h+12+r*18,5,8);});
    ctx.fillStyle='#2a2440';ctx.fillRect(0,hz,W,H-hz);ctx.fillStyle='#3a3354';ctx.fillRect(0,gy(),W,H-gy());
    items.forEach(it=>{const s=WD[it.i];ctx.font="900 16px Nunito,sans-serif";const w=ctx.measureText(s).width+22;ctx.fillStyle='#2a1a10';rrect(it.x-w/2,it.y-14+3,w,30,15);ctx.fill();ctx.fillStyle='#fff8ec';rrect(it.x-w/2,it.y-14,w,30,15);ctx.fill();ctx.fillStyle='#2a1a10';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s,it.x,it.y+1);});
    person(px,gy(),64,{robe:'#ff6b3d',hair:'#1e130c',legs:'#2d4a7a',skin:'#c58c5e',face,walk,armsUp:true,mood:sad>0?'sad':'happy'});
    hud('Lock It In');
    const shown=WD.slice(0,nx).join(' ')+(nx<WD.length?'  ____':'');
    ctx.fillStyle='rgba(255,248,236,.95)';rrect(16,48+SAFE,W-32,64,14);ctx.fill();
    ctx.font="900 15px Nunito,sans-serif";ctx.fillStyle='#2a1a10';ctx.textAlign='left';ctx.textBaseline='top';
    wrap(shown||'Catch the first word…',28,58+SAFE,W-56,19);
    ctx.font="800 11px Nunito,sans-serif";ctx.fillStyle='#c9853b';ctx.textAlign='right';ctx.fillText('PSALM 37:5',W-28,96+SAFE);
  };
  function wrap(s,x,y,mw,lh){const w=s.split(' ');let line='';for(const word of w){const tst=line?line+' '+word:word;if(ctx.measureText(tst).width>mw&&line){ctx.fillText(line,x,y);line=word;y+=lh;}else line=tst;}ctx.fillText(line,x,y);}
  return o;
}

/* ================= GAME FLOW ================= */
const LEVELS=[
  {make:LManna,lv:'LEVEL 1 · NUMBERS 11',title:'Manna',goal:'Catch the manna. Dodge the grumbling.',ctrl:'Drag to move'},
  {make:LRun,lv:'LEVEL 2 · JUDGES 4',title:'900 Chariots',goal:'Run to Mount Tabor with Deborah. Jump the chariots.',ctrl:'Tap to jump'},
  {make:LHem,lv:'LEVEL 3 · MATTHEW 9',title:'The Hem',goal:'Push through the crowd. Reach Jesus before He’s gone.',ctrl:'Hold & drag'},
  {make:LKnock,lv:'LEVEL 4 · MATTHEW 7:7',title:'Knock',goal:'Knock until it opens. Pop the doubts.',ctrl:'Tap fast'},
  {make:LMarina,lv:'LEVEL 5 · ST. MARINA',title:'Accused',goal:'They’re lying about you. Survive 22 seconds.',ctrl:'Your call'},
  {make:LPsalm,lv:'LEVEL 6 · PSALM 37:5',title:'Lock It In',goal:'Catch the verse in the right order.',ctrl:'Drag to move'}
];
let L=null,state='menu',lvIdx=0,score=[],T=0;
const starStr=n=>[0,1,2].map(i=>i<n?'★':'<span class="off">★</span>').join('');
function card(html,cls=''){ov.className=cls;ov.innerHTML=html;}
function on(id,fn){const b=document.getElementById(id);if(b)b.onclick=()=>{audioInit();snd(660,.08,'triangle',.06);fn();};}
function showMenu(){state='menu';L=null;card(`<div class="menuin"><div class="title">TRUST<br>ISSUES</div><div class="sub">6 levels. Who do you actually lean on?</div><button class="btn" id="b">Play</button></div>`,'menu');on('b',()=>{score=[];startLevel(0);});}
function startLevel(i){lvIdx=i;parts=[];L=LEVELS[i].make();state='card';const d=LEVELS[i];
  card(`<div class="card"><div class="lv">${d.lv}</div><h1>${d.title}</h1><p class="goal">${d.goal}</p><div class="ctrl">${d.ctrl}</div><button class="btn" id="b">Go!</button></div>`);
  on('b',play);}
function play(){ov.className='hide';P.taps.length=0;state='play';}
function retry(){parts=[];L=LEVELS[lvIdx].make();play();}
function showOutro(){const r=L.result;score[lvIdx]=Math.max(score[lvIdx]||0,r.stars);const last=lvIdx===LEVELS.length-1;
  card(`<div class="card"><div class="lv">${LEVELS[lvIdx].lv}</div><div class="stars">${starStr(r.stars)}</div><p class="goal">${r.msg}</p><div class="irl"><b>IRL</b>${r.irl}</div><div style="height:14px"></div><button class="btn" id="b">${last?'Results':'Next level'}</button><button class="btn alt" id="r">Replay</button></div>`);
  on('b',()=>last?showEnd():startLevel(lvIdx+1));on('r',retry);}
function showFail(){card(`<div class="card"><div class="lv">${LEVELS[lvIdx].lv}</div><h1>So close</h1><p class="goal">Sisera's chariots got you. Barak needed courage too.</p><div style="height:14px"></div><button class="btn" id="b">Try again</button></div>`);on('b',retry);}
function showEnd(){state='menu';L=null;const tot=score.reduce((a,b)=>a+(b||0),0),max=LEVELS.length*3;
  const [rk,line]=tot>=16?['Deborah Tier','You move when God says move.']:tot>=12?['Faithful','Strong run. Now play it in real life.']:tot>=8?['Barak Mode','You trust, with conditions. Getting there.']:['Still in the Desert','Manna falls fresh every morning. Run it back.'];
  card(`<div class="card"><div class="lv">YOUR SCORE</div><div class="big">${tot}<span style="font-size:28px;color:#c9853b">/${max}★</span></div><h1 style="font-size:36px">${rk}</h1><p class="goal">${line}</p>
  <details><summary>Talk about it</summary><ol><li>Did you keep grabbing quail? Why?</li><li>Did you hit “Defend yourself”? What would St. Marina say?</li><li>What’s the “grumble cloud” in your life right now?</li><li>Which level felt most like your real week?</li></ol></details>
  <div style="height:16px"></div><button class="btn" id="b">Play again</button></div>`);
  on('b',()=>{score=[];startLevel(0);});}

/* ---- menu scene ---- */
const crew=[{robe:'#c9853b',scarf:'#6e3f22'},{robe:'#2f6f8f',scarf:'#efe0bf',sash:'#ffd76a'},{robe:'#8b3a2a',hair:'#2a1a10',beard:'#2a1a10'},{robe:'#8d7f72',scarf:'#5f5246'},{robe:'#2e2638',scarf:'#1c1624',skin:'#c99068'},{robe:'#ff6b3d',hair:'#1e130c',legs:'#2d4a7a',skin:'#c58c5e'}];
function drawMenu(){desert(T*.3);const gy=H*.74;
  ctx.globalAlpha=.8;for(let k=0;k<14;k++){const x=(k*73+T*20)%W,y=((k*131+T*60)%(H*.7));ctx.shadowColor='#fff3c4';ctx.shadowBlur=8;circ(x,y,3,'#fffaf0');}ctx.shadowBlur=0;ctx.globalAlpha=1;
  crew.forEach((c,i)=>{const x=((i*72+T*45)%(W+120))-60;person(x,gy+(i%2)*10,58,Object.assign({face:1,walk:T*9+i,mood:'happy'},c));});}

/* ---- main loop ---- */
let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;T+=dt;
  try{
    ctx.save();if(shake>0){ctx.translate(rnd(-shake,shake),rnd(-shake,shake));shake=Math.max(0,shake-dt*35);}
    if(!L)drawMenu();else{if(state==='play'){L.update(dt);updParts(dt);}L.draw();drawParts();}
    ctx.restore();
    if(state==='play'&&L&&(L.done||L.fail)){L.endT=(L.endT||0)+dt;if(L.endT>1.1){state='card';L.fail?showFail():showOutro();}}
  }catch(e){ctx.restore();console.error(e);}
  P.taps.length=0;requestAnimationFrame(loop);}
if(document.fonts&&document.fonts.load)document.fonts.load("20px 'Lilita One'").catch(()=>{});
/* Teacher shortcut: add #level-3 (etc.) to the link to jump straight to a level */
const hm=/^#level-([1-6])$/.exec(location.hash);
if(hm)startLevel(+hm[1]-1);else showMenu();
requestAnimationFrame(loop);
}
</script>
